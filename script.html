<script>
  let currentUser = null;
  let myChart = null;

  // --- Utility: GAS Promise Wrapper ---
  function runGoogleScript(funcName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [funcName](...args);
    });
  }

  // --- Login System (อัปเดตระบบจดจำการล็อคอิน) ---
  async function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    
    Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      const res = await runGoogleScript('authenticateUser', user, pass);
      if (res.success) {
        currentUser = res.user;
        
        // 💡 บันทึกข้อมูลผู้ใช้ลงใน localStorage ของเบราว์เซอร์
        localStorage.setItem('assetManagerUser', JSON.stringify(currentUser));
        
        document.getElementById('displayUsername').innerText = currentUser.name;
        document.getElementById('displayRole').innerText = currentUser.role;
        document.getElementById('userAvatar').innerText = currentUser.name.charAt(0);
        
        Swal.close();
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('mainApp').classList.add('fade-in');
        
        initDashboard(); 
      } else {
        Swal.fire('ข้อผิดพลาด', 'Username หรือ Password ไม่ถูกต้อง', 'error');
      }
    } catch(err) {
      Swal.fire('Error', err.toString(), 'error');
    }
  }

  function logout() {
    currentUser = null;
    
    // 💡 ลบข้อมูลการจดจำออกจากเบราว์เซอร์เมื่อออกจากระบบ
    localStorage.removeItem('assetManagerUser');
    
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('loginForm').reset();
  }

// --- Navigation (SPA) ฉบับอัปเดตแก้ปัญหาแถบเมนู ---
  function navigate(viewId) {
    // 1. ซ่อนทุกหน้า และแสดงเฉพาะหน้าที่เลือก
    document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
    document.getElementById('view-' + viewId).classList.remove('hidden');
    
    // 2. เปลี่ยนชื่อ Title ด้านบน
    const titles = { 
      'dashboard': 'Dashboard', 
      'assets': 'จัดการครุภัณฑ์',
      'inspections': 'ตรวจสอบสภาพ',
      'scanner': 'สแกน QR Code'
    };
    document.getElementById('pageTitle').innerText = titles[viewId] || viewId;
    
    // 3. จัดการแถบสีไฮไลท์เมนู (Active State)
    const activeClasses = ['bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-700', 'dark:text-blue-400', 'font-medium'];
    const inactiveClasses = ['hover:bg-gray-100', 'dark:hover:bg-gray-800', 'text-gray-700', 'dark:text-gray-300'];

    // ล้างแถบสีออกจากทุกเมนูก่อน
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.remove(...activeClasses);
      el.classList.add(...inactiveClasses);
    });

    // ใส่แถบสีให้เฉพาะเมนูที่กำลังถูกเปิดอยู่
    const activeMenu = document.getElementById('nav-' + viewId);
    if (activeMenu) {
      activeMenu.classList.remove(...inactiveClasses);
      activeMenu.classList.add(...activeClasses);
    }
    
    // 4. หากเข้าหน้า "จัดการครุภัณฑ์" ให้ดึงข้อมูลจากตาราง
    if (viewId === 'assets') {
      loadAllAssets();
    }
  }

  // --- Theme Toggle (Dark Mode) ---
  function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    if(myChart) initDashboard(); // Re-render chart to match theme
  }

// --- Dashboard Logic ---
  async function initDashboard() {
    try {
      const data = await runGoogleScript('getDashboardData');
      console.log("ข้อมูล Dashboard:", data); // เอาไว้เช็คข้อมูลใน Console
      
      // Update Stats
      document.getElementById('stat-total').innerText = data.total || 0;
      document.getElementById('stat-normal').innerText = data.normal || 0;
      document.getElementById('stat-broken').innerText = data.broken || 0;
      document.getElementById('stat-lost').innerText = data.lost || 0;

      // Update Table
      const tbody = document.getElementById('recentAssetsTable');
      if (tbody) {
        tbody.innerHTML = '';
        data.assets.forEach(row => {
          let statusColor = row[5] === 'ปกติ' ? 'text-green-500' : (row[5] === 'ชำรุด' ? 'text-yellow-500' : 'text-red-500');
          tbody.innerHTML += `
            <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800">
              <td class="px-4 py-3 font-medium">${row[0]}</td>
              <td class="px-4 py-3">${row[1]}</td>
              <td class="px-4 py-3 font-bold ${statusColor}">${row[5]}</td>
            </tr>
          `;
        });
      }

      // Update Chart (เพิ่มการดักจับ Error ตรงนี้)
      const chartElement = document.getElementById('statusChart');
      if (!chartElement) {
        console.warn("ไม่พบพื้นที่วาดกราฟ (statusChart)");
        return; // หยุดการทำงานส่วนกราฟถ้าหา Element ไม่เจอ จะได้ไม่ Error
      }

      const isDark = document.documentElement.classList.contains('dark');
      const textColor = isDark ? '#e5e7eb' : '#374151';
      const ctx = chartElement.getContext('2d');
      
      if(myChart) myChart.destroy();
      
      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['ปกติ', 'ชำรุด', 'สูญหาย'],
          datasets: [{
            data: [data.normal, data.broken, data.lost],
            backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: textColor } }
          },
          cutout: '70%'
        }
      });
    } catch(err) {
      console.error('Error loading dashboard:', err);
    }
  }

          <div class="grid grid-cols-2 gap-4">

  // --- Asset Management Logic ---

      const data = await runGoogleScript('getAllAssets');
      const tbody = document.getElementById('allAssetsTable');
      tbody.innerHTML = '';
      
      data.forEach(row => {
        // ตกแต่งสี Badge ตามสถานะ
        let statusClass = row[5] === 'ปกติ' ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' : 
                         (row[5] === 'ชำรุด' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400' : 
                                             'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400');
        
        tbody.innerHTML += `
          <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors asset-row">

            <td class="px-4 py-3">${row[1]}</td>
            <td class="px-4 py-3">${row[2]}</td>
            <td class="px-4 py-3">${row[3]}</td>

              <span class="px-2 py-1 rounded-full text-xs font-semibold ${statusClass}">${row[5]}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
              <button onclick="viewQR('${row[7]}')" class="text-blue-500 hover:text-blue-700 mx-1 p-2 rounded hover:bg-blue-50 dark:hover:bg-gray-700" title="ดู QR Code">
                <i class="fas fa-qrcode"></i>
              </button>
              <button class="text-yellow-500 hover:text-yellow-700 mx-1 p-2 rounded hover:bg-yellow-50 dark:hover:bg-gray-700" title="แก้ไข (กำลังพัฒนา)">
                <i class="fas fa-edit"></i>
              </button>
              <button class="text-red-500 hover:text-red-700 mx-1 p-2 rounded hover:bg-red-50 dark:hover:bg-gray-700" title="ลบ (กำลังพัฒนา)">

  // --- Real-time Search ---
  function searchAssets() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    let rows = document.querySelectorAll('.asset-row');
    
    rows.forEach(row => {
      let text = row.innerText.toLowerCase();
      row.style.display = text.includes(input) ? '' : 'none';
    });
  }

  // --- View QR Code ---
  function viewQR(qrUrl) {
    Swal.fire({
      title: 'QR Code สำหรับสแกน',
      text: 'สามารถบันทึกรูปภาพเพื่อนำไปพิมพ์ติดครุภัณฑ์ได้',
      imageUrl: qrUrl,
      imageWidth: 200,
      imageHeight: 200,
      imageAlt: 'Asset QR Code',
      confirmButtonText: 'ปิดหน้าต่าง'
    });
  }

  // --- ระบบ Scanner (QR Code) ฉบับอัปเดตแก้ปัญหากล้อง ---
  let html5QrCode = null;

  function startCamera() {
    const btn = document.getElementById('cameraBtn');
    
    // ถ้ากล้องเปิดอยู่แล้ว ให้ทำการปิดกล้อง
    if (html5QrCode) {
      stopCamera();
      return;
    }

    document.getElementById('camera-placeholder').style.display = 'none';
    html5QrCode = new Html5Qrcode("qr-reader");
    
    // เปลี่ยนปุ่มเป็นสีเหลือง (กำลังโหลด)
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> กำลังเปิดกล้อง...';
    btn.className = "w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors";

    // 1. ค้นหากล้องทั้งหมดที่มีในอุปกรณ์
    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length > 0) {
        
        // 2. เลือกกล้อง (พยายามหากล้องหลังก่อน ถ้าไม่มีก็เอากล้องตัวแรก)
        let cameraId = devices[0].id;
        for (let i = 0; i < devices.length; i++) {
          if (devices[i].label.toLowerCase().includes("back") || devices[i].label.toLowerCase().includes("environment")) {
            cameraId = devices[i].id;
            break;
          }
        }

        // 3. สั่งเริ่มการสแกน
        html5QrCode.start(
          cameraId, 
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          (decodedText, decodedResult) => {
            // เมื่อสแกนติด
            stopCamera();
            Swal.fire({
              icon: 'success',
              title: 'สแกนรหัสสำเร็จ!',
              text: 'รหัสครุภัณฑ์: ' + decodedText,
              confirmButtonText: 'บันทึกการตรวจสอบ',
              showCancelButton: true,
              cancelButtonText: 'ยกเลิก'
            }).then((result) => {
              if (result.isConfirmed) {
                showInspectionModal(decodedText);
              }
            });
          },
          (errorMessage) => { /* กำลังค้นหา (ซ่อนข้อความไว้) */ }
        ).then(() => {
          // เปิดกล้องสำเร็จ เปลี่ยนปุ่มเป็นสีแดง (ไว้กดปิด)
          btn.innerHTML = '<i class="fas fa-video-slash mr-2"></i> ปิดกล้อง';
          btn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors";
        }).catch((err) => {
          Swal.fire('ขัดข้อง', 'ไม่สามารถดึงภาพจากกล้องได้', 'error');
          stopCamera();
        });

      } else {
        Swal.fire('ไม่พบกล้อง', 'อุปกรณ์นี้ไม่มีกล้อง หรือเบราว์เซอร์ไม่อนุญาต', 'warning');
        stopCamera();
      }
    }).catch(err => {
      // กรณีผู้ใช้กด Block Permission
      Swal.fire({
        icon: 'error',
        title: 'เบราว์เซอร์บล็อกกล้อง',
        text: 'กรุณากดที่ไอคอน 🔒 (แม่กุญแจ) ข้างๆ ช่อง URL ด้านบน แล้วเลือกอนุญาต (Allow) ให้ใช้งานกล้องครับ'
      });
      stopCamera();
    });
  }

  function stopCamera() {
    const resetUI = () => {
      document.getElementById('camera-placeholder').style.display = 'block';
      const btn = document.getElementById('cameraBtn');
      btn.innerHTML = '<i class="fas fa-video mr-2"></i> เปิดกล้องมือถือ';
      btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors";
    };

    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        html5QrCode = null;
        resetUI();
      }).catch(err => {
        html5QrCode.clear();
        html5QrCode = null;
        resetUI();
      });
    } else {
      resetUI();
    }
  }

  // --- ฟังก์ชันเสริม: อ่าน QR Code จากไฟล์ภาพ (แก้ปัญหา iOS) ---
  function scanFromImage(event) {
    if (event.target.files.length === 0) return;
    const file = event.target.files[0];
    
    // แสดงหน้าจอโหลด
    Swal.fire({ title: 'กำลังวิเคราะห์ QR Code...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

    // ใช้ไลบรารีเดิม แต่สั่งให้อ่านจากรูปภาพแทน
    const html5QrCode = new Html5Qrcode("qr-reader");
    html5QrCode.scanFile(file, true)
      .then(decodedText => {
        Swal.close(); // ปิดหน้าจอโหลด
        
        Swal.fire({
          icon: 'success',
          title: 'สแกนรหัสสำเร็จ!',
          text: 'รหัสครุภัณฑ์: ' + decodedText,
          confirmButtonText: 'บันทึกการตรวจสอบ',
          showCancelButton: true,
          cancelButtonText: 'ยกเลิก'
        }).then((result) => {
          if (result.isConfirmed) {
            showInspectionModal(decodedText);
          }
        });
      })
      .catch(err => {
        Swal.fire('ไม่พบ QR Code', 'ภาพไม่ชัดเจน หรือไม่มี QR Code อยู่ในภาพ กรุณาลองถ่ายใหม่อีกครั้งครับ', 'error');
      });
      
    // ล้างค่า input เผื่อผู้ใช้กดอัปโหลดรูปเดิมซ้ำ
    event.target.value = '';
  }

  // --- Inspection Form Logic ---
  function showInspectionModal(prefillAssetId = '') {
    Swal.fire({

      html: `
        <div class="text-left mt-4">
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">รหัสครุภัณฑ์ (Asset ID)</label>
          <input id="swal-insp-id" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 mb-4 dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="เช่น 69บธ.-99000045111600-0001" value="${prefillAssetId}">
          
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">สถานะปัจจุบัน</label>
          <select id="swal-insp-status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 mb-4 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option value="ปกติ">🟢 ปกติ (ใช้งานได้ดี)</option>
            <option value="ชำรุด">🟡 ชำรุด (ต้องส่งซ่อม)</option>
            <option value="สูญหาย">🔴 สูญหาย (หาไม่พบ)</option>
          </select>
          
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">หมายเหตุ / อาการเสีย</label>
          <textarea id="swal-insp-note" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)..."></textarea>
        </div>
      `,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: 'บันทึกผล',
      cancelButtonText: 'ยกเลิก',
      preConfirm: () => {
        const assetId = document.getElementById('swal-insp-id').value.trim();
        if (!assetId) {
          Swal.showValidationMessage('กรุณาระบุรหัสครุภัณฑ์');
          return false;
        }
        return {
          assetId: assetId,
          status: document.getElementById('swal-insp-status').value,
          note: document.getElementById('swal-insp-note').value
        }
      }
    }).then(async (result) => {
      if (result.isConfirmed) {
        Swal.fire({ title: 'กำลังอัปเดตข้อมูล...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
        // ส่งข้อมูลไปหลังบ้าน
        const res = await runGoogleScript('saveInspection', result.value.assetId, result.value.status, result.value.note, currentUser.username);
        
        if (res.success) {
          Swal.fire('สำเร็จ!', res.message, 'success').then(() => {
            // อัปเดต Dashboard ใหม่ เพื่อให้กราฟสัดส่วนเปลี่ยนตาม
            initDashboard(); 
            // ถ้าเปิดหน้าจัดการครุภัณฑ์ค้างไว้ ก็ให้โหลดข้อมูลใหม่ด้วย
            if (!document.getElementById('view-assets').classList.contains('hidden')) {
              loadAllAssets();
            }
          });
        } else {
          Swal.fire('ผิดพลาด', res.message, 'error');
        }
      }
    });
  }

  // --- Bulk Import Modal (นำเข้าหลายรายการจาก Excel) ---
  function showBulkImportModal() {
    Swal.fire({
      title: 'นำเข้าข้อมูลจาก Excel',
      width: '700px',
      html: `
        <div class="text-left mt-4">
          <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">
            1. เปิด Excel/Google Sheets และจัดเรียง 5 คอลัมน์ดังนี้: <br>
            <span class="font-bold text-blue-500">รหัส | ชื่อรายการ | หมวดหมู่ | สถานที่ | ราคา</span><br>
            2. ลากคลุมข้อมูลก๊อปปี้ (Ctrl+C) แล้วนำมาวาง (Ctrl+V) ในช่องด้านล่างนี้ได้เลย <br>
            <span class="text-red-500 text-xs">*หากไม่มีรหัส ให้เว้นคอลัมน์แรกให้ว่างไว้</span>
          </p>
          <textarea id="swal-bulk-data" rows="8" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 dark:bg-gray-700 dark:border-gray-600 dark:text-white whitespace-pre text-sm" placeholder="วางข้อมูลจาก Excel ลงที่นี่..."></textarea>
        </div>
      `,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: '<i class="fas fa-upload mr-2"></i> นำเข้าข้อมูล',
      cancelButtonText: 'ยกเลิก',
      customClass: { confirmButton: 'bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded' },
      preConfirm: () => {
        const rawData = document.getElementById('swal-bulk-data').value.trim();
        if (!rawData) {
          Swal.showValidationMessage('กรุณาวางข้อมูลที่ต้องการนำเข้า');
          return false;
        }
        
        // แยกบรรทัด (Enter) และแยกคอลัมน์ (Tab)
        const rows = rawData.split('\n');
        const assetsArray = [];
        
        for (let i = 0; i < rows.length; i++) {
          const cols = rows[i].split('\t'); 
          // ต้องมีอย่างน้อย 1 คอลัมน์ถึงจะทำงาน
          if (cols.length > 0) {
            let id = cols[0] ? cols[0].trim() : '';
            let name = cols[1] ? cols[1].trim() : '';
            let cat = cols[2] ? cols[2].trim() : 'Other';
            let loc = cols[3] ? cols[3].trim() : '-';
            let price = cols[4] ? parseFloat(cols[4].trim().replace(/,/g, '')) : 0;
            
            // กรณีผู้ใช้ก๊อปปี้มาแค่คอลัมน์เดียว (ไม่มีรหัส นำมาแต่ชื่อ)
            if (!name && id) {
               name = id;
               id = '';
            }
            
            if (name) {
              assetsArray.push({ id: id, name: name, category: cat, location: loc, price: isNaN(price) ? 0 : price });
            }
          }
        }
        
        if (assetsArray.length === 0) {
          Swal.showValidationMessage('รูปแบบข้อมูลไม่ถูกต้อง');
          return false;
        }
        return assetsArray;
      }
    }).then(async (result) => {
      if (result.isConfirmed) {
        Swal.fire({ title: 'กำลังนำเข้าข้อมูล...', text: 'อาจใช้เวลาสักครู่', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
        const res = await runGoogleScript('addMultipleAssets', result.value, currentUser.username);
        
        if(res.success) {
          Swal.fire('สำเร็จ!', res.message, 'success').then(() => {
            initDashboard(); 
            if (!document.getElementById('view-assets').classList.contains('hidden')) {
              loadAllAssets(); 
            }
          });
        } else {
          Swal.fire('ผิดพลาด', res.message, 'error');
        }
      }
    });
  }

  // --- Auto Login Check (ทำงานทันทีเมื่อเปิดหน้าเว็บ) ---
  window.addEventListener('DOMContentLoaded', () => {
    // ไปเช็คในเครื่องว่ามีข้อมูลที่บันทึกไว้ไหม
    const savedUser = localStorage.getItem('assetManagerUser');
    
    if (savedUser) {
      // ถ้ามี ให้ดึงข้อมูลกลับมาและข้ามหน้า Login ทันที
      currentUser = JSON.parse(savedUser);
      
      document.getElementById('displayUsername').innerText = currentUser.name;
      document.getElementById('displayRole').innerText = currentUser.role;
      document.getElementById('userAvatar').innerText = currentUser.name.charAt(0);
      
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('fade-in');
      
      initDashboard(); // โหลดข้อมูลแสดงผล
    }
  });
</script>
